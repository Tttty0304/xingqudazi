# 多实例能力验证专用负载均衡配置（配合 docker-compose.multi-instance.yml）。
#
# 默认的 round-robin 策略（nginx upstream 未显式声明算法时的默认行为）会把
# 新到来的连接依次轮流分配给 server / server2——WS 连接的 Upgrade 请求本身
# 就是"一次新连接"，因此两个先后建立的 WS 连接大概率会落在两个不同的后端进程，
# 这正是我们要验证的场景：不同物理进程之间的用户是否真的能通过 Redis Pub/Sub
# 互相收到广播/私聊消息，而不是像此前那样"单实例自己发布自己订阅"。
upstream backend_pool {
    server server:8080;
    server server2:8080;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        proxy_pass http://backend_pool/healthz;
    }

    location /readyz {
        proxy_pass http://backend_pool/readyz;
    }

    location /ws {
        proxy_pass http://backend_pool/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WS 是长连接，不应有代理层的读超时导致心跳期间被误断开
        # （心跳周期 pingPeriod = 60s*9/10 = 54s，留足余量）。
        proxy_read_timeout 90s;
    }
}
