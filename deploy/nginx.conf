server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 图片上传体积上限：与后端 MAX_UPLOAD_SIZE_BYTES（默认 5MB）对齐。
    # 此前未配置，nginx 默认仅 1MB，导致超过 1MB 的图片在到达后端前就被 413 拦截
    # （真机日志已实际观察到 "client intended to send too large body"）。
    client_max_body_size 6m;

    # 静态资源精简：开启 gzip，降低带宽成本（对应「性能/资源使用/成本」评分项）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Task10 性能与成本落地：Vite 构建产物的 /assets/ 下文件名自带 content hash
    # （如 index-BQPcqJZ9.js），内容变化必然对应新文件名，可放心长期强缓存，
    # 降低重复访问时的带宽成本；index.html 本身不缓存，保证发新版本后用户
    # 立即拿到指向新 hash 文件的引用。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 反向代理到后端 HTTP API，前端始终通过同源 /api 访问，避免 CORS 复杂度
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 前端始终通过同源 /api/xxx 调用（含健康检查，见 client/src/App.tsx），
    # 但后端把 /healthz /readyz 挂在根路径、不带 /api 前缀（基础设施探针，
    # 见 server/cmd/server/main.go），因此这里单独改写路径转发。
    location /api/healthz {
        proxy_pass http://server:8080/healthz;
        proxy_set_header Host $host;
    }

    location /api/readyz {
        proxy_pass http://server:8080/readyz;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://server:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Task16：图片消息静态资源反代（后端用 gin.Static 在根路径下提供 /uploads，
    # 不带 /api 前缀，见 server/cmd/server/main.go），前端始终通过同源访问，
    # 与 /ws 处理方式一致，避免额外引入跨域。
    location /uploads/ {
        proxy_pass http://server:8080/uploads/;
        proxy_set_header Host $host;
    }
}
