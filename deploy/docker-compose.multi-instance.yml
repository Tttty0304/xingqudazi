# 多实例横向扩展能力验证专用 overlay（能力补齐项：更丰富的部署与运行时测试）。
#
# 背景：项目文档（docs/13-architecture-and-adr.md ★3）一直声称"Redis Pub/Sub
# 多实例扇出为强制设计"，但此前从未有过真正的第二个独立进程参与验证——所有
# 测试场景下永远只有一个 server 容器在运行，广播消息本质上是"自己发布给自己
# 订阅"，Redis 是否真的承担了跨进程转发的职责从未被证实过。
#
# 用法（叠加在默认 docker-compose.yml 之上，不修改/替代默认单实例部署）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.multi-instance.yml up -d --build
#   python3 scripts/multi_instance_test.py http://localhost:8082
#
# 验证完毕后可以直接停掉这个 overlay 引入的额外容器，不影响默认单实例服务：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.multi-instance.yml down server2 lb
#
# 已知边界（如实标注）：这仍然是同一台机器上的多个容器，不是真正的多机/多可用区
# 部署；也没有引入 Kubernetes/Nomad 等编排系统的健康检查驱逐、自动扩缩容等能力，
# 只验证"多进程 + Redis Pub/Sub 广播 + nginx 负载均衡"这一条核心链路是否真的通。

services:
  server2:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      POSTGRES_DSN: "postgres://im_user:im_password@postgres:5432/xingqudazi_im?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "please-change-me-in-production"
      ALLOW_GUEST: "true"
      # 显式指定实例标识（而不是依赖容器 hostname），让测试脚本/日志里的
      # instance_id 更好辨认（对比默认 server 服务，其 INSTANCE_ID 未设置，
      # 回落到容器 hostname，即容器 ID 短哈希，同样具有唯一性）。
      INSTANCE_ID: "server2"
    volumes:
      - media_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  lb:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - server
      - server2
